name: Spec watch

# The Agenzia delle Entrate announces no updates: every week this compares the official pages and
# files with the fingerprints in specs/sources.json, checks that the code-list descriptions follow
# the current edition of their yearly sources, and opens an issue if something changed.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

# Two runs at once could open the same issue twice.
concurrency:
  group: ${{ github.workflow }}

jobs:
  watch:
    name: Watch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # open the issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The script only needs Node: no dependencies to install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Compare with the saved fingerprints
        id: compare
        run: |
          node scripts/spec-watch.ts --out "$RUNNER_TEMP/sources.json" --report "$RUNNER_TEMP/issue.md"
          if [ -f "$RUNNER_TEMP/issue.md" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      # The current fingerprints, ready to replace specs/sources.json.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources
          path: ${{ runner.temp }}/sources.json
      - name: Open an issue
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Specifiche ufficiali cambiate: da verificare"
        run: |
          # One open issue is enough: it stays open until specs/ is updated.
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq length)
          if [ "$open" -gt 0 ]; then
            echo "An issue is already open: not opening another."
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md" --label needs-triage
          fi
